# multi-decode TOML — fsdax baseline (ralph + vanilla LocalDiskBackend on /pmem/...).
# Hybrid model (Qwen3.6-27B). Mirrors lmcache-perf-analysis/ttft_bench/configs/
# fsdax/* in shape so the existing harness (multi-decode binary,
# run_one_config.sh, plot scripts) works without code change.
#
# Hybrid-mode flags (--no-disable-hybrid-kv-cache-manager,
# --enable-prefix-caching) are injected into kv_transfer_config because
# multi-decode's serve-command format-string only exposes that one
# trailing slot — the extra flags are appended after the kv-transfer-
# config JSON and reach `vllm serve` as additional argv tokens.

[paths]
src_dir = "/home/NBB/kogi/work/workspace/archived/test/LMBenchmark/real-multi-round-qa/data_hf/32k"
workdir = "/work/0/NBB/kogi/workspace/nilpe-lmcache/bench/results/fsdax"
hf_model = "/work/NBB/kogi/hf_cache/hub/models--Qwen--Qwen3.6-27B/snapshots/6a9e13bd6fc8f0983b9b99948120bc37f49c13e9"
file_pattern = "*.txt"

[server]
tp_size = 1
max_model_len = 32768
gpu_mem_util = 0.85
dtype = "auto"
kv_transfer_config = "'{\"kv_connector\":\"LMCacheConnectorV1\",\"kv_role\":\"kv_both\"}' --no-disable-hybrid-kv-cache-manager --enable-prefix-caching"
host = "0.0.0.0"
base_port = 8000
ready_retries = 600
ready_interval_sec = 1.0
venv_bin = "/work/0/NBB/kogi/workspace/nilpe-bench-venv/venv/bin/activate"
extra_env = [
  "HF_HOME=/work/NBB/kogi/hf_cache",
  "HF_HUB_ENABLE_HF_TRANSFER=1",
  "LMCACHE_USE_EXPERIMENTAL=True",
  "VLLM_ATTENTION_BACKEND=FLASH_ATTN",
  "VLLM_WORKER_MULTIPROC_METHOD=spawn",
  "LMCACHE_CONFIG_FILE=/work/0/NBB/kogi/workspace/nilpe-lmcache/bench/configs/multidecode_fsdax.yaml",
  "no_proxy=localhost,127.0.0.1",
  "NO_PROXY=localhost,127.0.0.1",
  "PYTHONHASHSEED=0",
]

[client]
request_timeout_sec = 480.0
stream_timeout_sec = 120.0
connect_timeout_sec = 5.0

[workload]
concurrent = 4
session_depth = 16
num_rounds = 3
answer_len = 256
model = ""
warmup_iters = 4

[runtime]
seed = 42
output_prefix = "summary"
debug = false

[log]
per_rank_dir = "rank_logs"
